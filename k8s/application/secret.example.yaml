---
# TEMPLATE ONLY - do not commit a populated copy.
#
# Kubernetes Secrets are base64-encoded, not encrypted. Create the real Secret
# at deploy time instead:
#
#   kubectl create secret generic app-secret -n library \
#     --from-literal=DB_PASSWORD='<database-password>' \
#     --from-literal=FLASK_SECRET_KEY="$(openssl rand -hex 32)"
#
# In a real environment this should come from Azure Key Vault via the Secrets
# Store CSI driver - see "Next steps" in the README.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: library
type: Opaque
stringData:
  DB_PASSWORD: REPLACE_ME
  FLASK_SECRET_KEY: REPLACE_ME
