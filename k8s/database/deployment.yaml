apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: library
  labels:
    app: mysql
    tier: database
    project: digital-library

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: mysql
        tier: database
        project: digital-library

    spec:
      containers:
      - name: mysql

        image: devsecops1acr.azurecr.io/database:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 3306

        envFrom:
        - configMapRef:
            name: db-config

        - secretRef:
            name: db-secret

        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"

          limits:
            cpu: "1000m"
            memory: "1Gi"

        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 40
          periodSeconds: 20

        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 20
          periodSeconds: 10
