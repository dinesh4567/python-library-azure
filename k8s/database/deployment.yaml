apiVersion: apps/v1
kind: Deployment

metadata:
  name: mysql
  namespace: library
  labels:
    app: mysql
    tier: database
    project: digital-library

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: mysql
        tier: database
        project: digital-library

    spec:
      containers:
      - name: mysql

        image: ACR_LOGIN_SERVER/database:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3306

        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_DATABASE

        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"

          limits:
            cpu: "1000m"
            memory: "1Gi"

        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 40
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
